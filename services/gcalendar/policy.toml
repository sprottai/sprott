[default]
read = "allow"
write = "ask"

[[rule]]
id = "list-events"
label = "List events"
match = "GET /calendar/v3/calendars/*/events"
level = "allow"

[[rule]]
id = "delete-event"
label = "Delete event"
match = "DELETE /calendar/v3/calendars/*/events/*"
level = "ask-always"

# A batch (POST /batch/calendar/v3, multipart/mixed) can carry an event delete.
[[rule]]
id = "batch"
label = "Send a batch of Calendar calls (can delete events)"
match = "POST /batch/**"
level = "ask-always"
