# Google Calendar policy. Events go through: creating, editing, deleting,
# inviting guests and emailing them. Asks before a whole calendar is shared,
# deleted or cleared (both need more access than the connection requests).
# See docs/POLICY.md.

[default]
read = "allow"
write = "allow"

[[rule]]
id = "list-events"
label = "List events"
method = "GET"
path = "/calendar/v3/calendars/:calendar/events"
level = "allow"

[[rule]]
id = "delete-event"
label = "Delete event"
method = "DELETE"
path = "/calendar/v3/calendars/:calendar/events/:event"
level = "allow"

[[rule]]
id = "share-calendar"
label = "Share a whole calendar with someone or publicly"
method = ["POST", "PUT", "PATCH"]
path = ["/calendar/v3/calendars/:calendar/acl", "/calendar/v3/calendars/:calendar/acl/:rule"]
level = "ask-always"

# Deleting a calendar, or clearing one, drops every event in it at once.
[[rule]]
id = "delete-calendar"
label = "Delete or clear a whole calendar (drops all its events)"
method = ["DELETE", "POST"]
path = ["/calendar/v3/calendars/:calendar", "/calendar/v3/calendars/:calendar/clear"]
level = "ask-always"

# A batch is decided by the calls inside it; this rule lets a connection ask
# for every batch.
[[rule]]
id = "batch"
label = "Send a batch of Calendar calls"
method = "POST"
path = ["/batch", "/batch/*"]
level = "allow"
