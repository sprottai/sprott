# Supabase policy (Management API, api.supabase.com/v1). The token never enters
# the agent and egress is host-anchored, so routine developer work — creating
# projects, running SQL (POST /v1/projects/*/database/query), managing tables,
# edge functions, config, secrets, branches — rides the write=allow floor. The
# gate is spent on the consequential few, in four buckets: read a secret,
# destroy, mint a credential, change who can reach/own the project.
#
# Paths + methods below are ground truth from the OpenAPI spec
# (api.supabase.com/api/v1-json, 2026-07-08), not guessed. REST can't collapse
# operations into one body-regex the way GraphQL can, so each path is its own
# rule; that's why supabase carries more rules than railway for the same idea.
#
# SQL query is deliberately NOT gated: it's the daily bread (migrations, reads),
# and like `git push` it can't be cheaply told apart from a read.

[default]
read = "allow"
write = "allow"

# ── Read a secret (the response carries it in plain text) ────────────────────
# Reads ride the allow floor, except these GETs, whose responses hold secret
# values: an agent reading them would hold the very credential the broker keeps
# from it. Fields per the OpenAPI spec (api.supabase.com/api/v1-json, fetched
# 2026-10-19); the api-keys behaviour per the recorded responses in the
# Supabase CLI repo (supabase/cli):
#   /v1/projects/{ref}/api-keys, …/api-keys/{id}  `api_key`: a secret key is
#       unmasked with `reveal=true`, and the legacy service_role key (a JWT)
#       comes back without it too, so the whole path is gated, not `reveal`
#   /v1/projects/{ref}/postgrest   `jwt_secret` (signs the project's JWTs)
#   /v1/projects/{ref}/pgsodium    `root_key` ("The pgsodium root key")
#   /v1/branches/{branch_id_or_ref}  `db_pass`, `jwt_secret` of the branch
# Not gated: /config/auth and /secrets return an HMAC or digest of each secret
# (v2 spec: "Auth secrets are returned as an HMAC of their value"; CLI docs:
# "value is digest"), and the pooler's connection_string carries the
# placeholder [YOUR-PASSWORD], not the password.
[[rule]]
id = "read-secrets"
label = "Read project secrets (API keys, JWT secret, database password, encryption root key)"
label_zh = "读取项目密钥（API key、JWT 密钥、数据库密码、加密根密钥）"
consent = "Read this project's secret values in plain text, such as API keys, the JWT secret or the database password."
consent_zh = "以明文读取这个项目的密钥，比如 API key、JWT 密钥或数据库密码。"
method = "GET"
path = [
  "/v1/projects/:ref/api-keys",
  "/v1/projects/:ref/api-keys/:id",
  "/v1/projects/:ref/postgrest",
  "/v1/projects/:ref/pgsodium",
  "/v1/branches/:branch",
  # The pgbouncer config's connection_string isn't documented as carrying the
  # placeholder the pooler's does: gated until shown masked.
  "/v1/projects/:ref/config/database/pgbouncer",
]
level = "ask-always"

# ── Destroy / lose work (irreversible) ───────────────────────────────────────
# Only the project-level DELETE — the path is exactly one segment after
# `projects`, so sub-resource deletes (a function, a secret, a branch) stay on
# the floor (recoverable).
[[rule]]
id = "delete-project"
label = "Delete a project (destroys its database and all data)"
label_zh = "删除项目（销毁其数据库和全部数据）"
consent = "Delete this Supabase project with its database and all data."
consent_zh = "删除这个 Supabase 项目，连同其中的数据库和全部数据。"
method = "DELETE"
path = "/v1/projects/:ref"
level = "ask-always"

# ── Mint a durable credential (escapes the broker) ───────────────────────────
# A new API key (the secret/service-role class is god-mode over the database) is
# a credential Sprott never brokers — minting one via the API end-runs
# credential separation. Editing/deleting a specific key (…/api-keys/{id}) is a
# deeper path and stays on the floor.
[[rule]]
id = "mint-api-key"
label = "Create a project API key"
label_zh = "创建项目 API key"
consent = "Create {{ request.body.type }} API key {{ request.body.name }} for this project. A secret key bypasses row-level security."
consent_zh = "为这个项目创建 {{ request.body.type }} API key {{ request.body.name }}。类型为 secret 的 key 可以绕过行级安全（RLS）。"
method = "POST"
path = "/v1/projects/:ref/api-keys"
level = "ask-always"

# ── Change who can reach the database (security posture) ─────────────────────
# Applying network restrictions can open the project to 0.0.0.0/0 (the whole
# internet), like making a repo public. Supabase exposes the same operation at
# two endpoints (Beta apply + Alpha patch); the path list is an OR so ONE rule
# (one console toggle) covers both — neither is a bypass.
[[rule]]
id = "open-network"
label = "Change network restrictions (who can reach the database)"
label_zh = "修改网络限制（谁能连接数据库）"
consent = "Change which IP addresses can reach this project's database."
consent_zh = "修改哪些 IP 地址可以连接这个项目的数据库。"
method = ["POST", "PATCH"]
path = [
  "/v1/projects/:ref/network-restrictions/apply",
  "/v1/projects/:ref/network-restrictions",
]
level = "ask-always"

# ── Hand the project to another owner ────────────────────────────────────────
# Creating a claim token lets another organization take ownership of the project
# — the transfer-repo parallel.
[[rule]]
id = "transfer-ownership"
label = "Create a claim token (hand the project to another owner)"
label_zh = "创建认领 token（把项目交给另一个所有者）"
consent = "Create a claim token. Whoever has it can move this project into their own organization."
consent_zh = "创建一个认领 token，拿到它的人可以把这个项目转到自己的组织下。"
method = "POST"
path = "/v1/projects/:ref/claim-token"
level = "ask-always"
