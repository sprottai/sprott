# crates.io policy. Routine registry traffic — search, crate metadata, version
# lookups, `/me` identity checks, downloads — flows freely; the approval gate is
# spent on the few operations the ecosystem itself treats as consequential:
# crates.io scopes its own tokens by exactly publish / yank / change-owners, and
# Trusted Publishing exists so nobody has to hold a standing publish credential.
# Each rule is a per-connection override point in the console.
#
# `cargo publish/yank/owner` all speak these same /api/v1 paths, so the rules
# gate cargo and raw curl alike. The sparse index (index.crates.io) and crate
# downloads (static.crates.io) are separate unauthenticated hosts and never
# route through this connection.
#
# DELETE /api/v1/crates/{name} (full crate deletion, RFC 3660) is deliberately
# absent: crates.io serves it cookie-only — an API token can never reach it.

[default]
read = "allow"
write = "allow"

# ── Publish (irreversible: crates.io only yanks, never deletes) ──────────────
# `ask` rather than `ask-always`: a workspace release publishes many crates
# back-to-back through this one path, and each verify-build can take minutes —
# the 30-minute window makes that one passkey per release train, not per crate.
[[rule]]
id = "publish"
label = "Publish a crate version"
label_zh = "发布一个 crate 版本"
consent = "Publish a new crate version on crates.io, where anyone can download it."
consent_zh = "在 crates.io 发布一个新的 crate 版本，任何人都能下载。"
method = "PUT"
path = "/api/v1/crates/new"
level = "ask"
ttl = 1800

# ── Version availability (recoverable, but shifts what downstream resolves) ──
[[rule]]
id = "yank"
label = "Yank a version"
label_zh = "撤回（yank）一个版本"
consent = "Yank this version. New projects stop picking it up; projects that already use it keep working."
consent_zh = "yank 这个版本，新项目不会再选用它，已经在用的项目照常可用。"
method = "DELETE"
path = "/api/v1/crates/:crate/:version/yank"
level = "ask"

[[rule]]
id = "unyank"
label = "Unyank a version"
label_zh = "取消 yank 一个版本"
consent = "Unyank this version so projects can pick it up again."
consent_zh = "取消这个版本的 yank，项目可以重新选用它。"
method = "PUT"
path = "/api/v1/crates/:crate/:version/unyank"
level = "ask"

# The newer PATCH form of yank/unyank (sets `yanked` + `yank_message`).
[[rule]]
id = "update-version"
label = "Update a version (yank status / message)"
label_zh = "更新一个版本（yank 状态或说明）"
consent = "Yank or unyank this version, or change its yank message."
consent_zh = "yank 或取消 yank 这个版本，或修改 yank 说明。"
method = "PATCH"
path = "/api/v1/crates/:crate/:version"
level = "ask"

# ── Change who can publish (security posture) ────────────────────────────────
[[rule]]
id = "add-owner"
label = "Add a crate owner"
label_zh = "添加 crate 所有者"
consent = "Add {{ request.body.users }} {{ request.body.owners }} as owners of this crate. Owners can publish new versions."
consent_zh = "把 {{ request.body.users }} {{ request.body.owners }} 加为这个 crate 的所有者，所有者可以发布新版本。"
method = "PUT"
path = "/api/v1/crates/:crate/owners"
level = "ask-always"

[[rule]]
id = "remove-owner"
label = "Remove a crate owner"
label_zh = "移除 crate 所有者"
consent = "Remove {{ request.body.users }} {{ request.body.owners }} as owners of this crate."
consent_zh = "把 {{ request.body.users }} {{ request.body.owners }} 从这个 crate 的所有者中移除。"
method = "DELETE"
path = "/api/v1/crates/:crate/owners"
level = "ask-always"

# ── Supply chain (standing publish rights for CI; publish-security settings) ─
# Creating a Trusted Publishing config lets a CI workflow mint publish tokens
# from then on — the crates.io analog of adding a deploy key.
[[rule]]
id = "add-trusted-publishing"
label = "Add a Trusted Publishing config (CI publish rights)"
label_zh = "添加 Trusted Publishing 配置（CI 发布权限）"
consent = "Let a CI workflow publish new versions of a crate from now on."
consent_zh = "允许一个 CI workflow 今后发布某个 crate 的新版本。"
method = "POST"
path = "/api/v1/trusted_publishing/:resource"
level = "ask-always"

[[rule]]
id = "remove-trusted-publishing"
label = "Remove a Trusted Publishing config"
label_zh = "移除 Trusted Publishing 配置"
consent = "Remove this Trusted Publishing config. Its CI workflow can no longer publish the crate."
consent_zh = "移除这份 Trusted Publishing 配置，对应的 CI workflow 将不能再发布这个 crate。"
method = "DELETE"
path = "/api/v1/trusted_publishing/:resource/:id"
level = "ask"

# PATCH crate settings currently carries one field: `trustpub_only` — whether
# the crate accepts token publishes at all. Loosening it widens the publish
# surface, so the whole settings path is gated.
[[rule]]
id = "crate-settings"
label = "Change crate publish settings"
label_zh = "修改 crate 的发布设置"
consent = "Change this crate's publish settings, such as whether it accepts publishes made with an API token."
consent_zh = "修改这个 crate 的发布设置，比如是否接受用 API token 发布。"
method = "PATCH"
path = "/api/v1/crates/:crate"
level = "ask-always"

# ── Credential lifecycle ──────────────────────────────────────────────────────
[[rule]]
id = "revoke-token"
label = "Revoke an API token"
label_zh = "吊销一个 API token"
consent = "Revoke this crates.io API token. Tools or CI that use it lose access."
consent_zh = "吊销这个 crates.io API token，用它的工具或 CI 将失去访问权限。"
method = "DELETE"
path = "/api/v1/me/tokens/:token"
level = "ask"

# Revoking the token this connection injects bricks the connection until the
# user mints a replacement by hand.
[[rule]]
id = "revoke-current-token"
label = "Revoke this connection's own token"
label_zh = "吊销这个连接自己的 token"
consent = "Revoke the token this connection uses. The connection stops working until you add a new token."
consent_zh = "吊销这个连接正在用的 token，换上新 token 前这个连接无法使用。"
method = "DELETE"
path = "/api/v1/tokens/current"
level = "ask"
