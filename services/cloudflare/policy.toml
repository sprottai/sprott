# Cloudflare policy (whole v4 API; token never enters the agent, egress is
# host-anchored). Reads and creating records ride the floor. The gate is spent on
# the changes that can silently hijack traffic: deleting a record can take a
# service offline, and overwriting an existing A/MX/CNAME can re-point web or
# mail traffic to an attacker. Each rule is a per-connection console toggle.
#
# Paths are relative to host api.cloudflare.com (base /client/v4). Cloudflare
# exposes both PUT (overwrite) and PATCH (partial update) on a record; both can
# re-point, so both are gated. The batch endpoint and deleting a whole zone
# reach the same changes, so they are gated too.

[default]
read = "allow"
write = "allow"

# ── Re-point / remove traffic ────────────────────────────────────────────────
[[rule]]
id = "delete-dns-record"
label = "Delete a DNS record"
method = "DELETE"
path = "/client/v4/zones/:zone/dns_records/:record"
level = "ask-always"

[[rule]]
id = "overwrite-dns-record"
label = "Overwrite a DNS record (can re-point traffic)"
method = "PUT"
path = "/client/v4/zones/:zone/dns_records/:record"
level = "ask-always"

[[rule]]
id = "patch-dns-record"
label = "Update a DNS record (can re-point traffic)"
method = "PATCH"
path = "/client/v4/zones/:zone/dns_records/:record"
level = "ask-always"

[[rule]]
id = "batch-dns-records"
label = "Change DNS records in a batch (can delete or re-point traffic)"
method = "POST"
path = "/client/v4/zones/:zone/dns_records/batch"
level = "ask-always"

[[rule]]
id = "delete-zone"
label = "Delete a zone and all its DNS records"
method = "DELETE"
path = "/client/v4/zones/:zone"
level = "ask-always"
