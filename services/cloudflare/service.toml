setup = """
Cloudflare's v4 API takes a bearer API token, and account-scoped endpoints
(/accounts/<id>/...) also need your Account ID - the token page shows both, so
paste both here. The proxy substitutes each at egress; neither enters the agent:
  sprott run -- curl \\
    "https://api.cloudflare.com/client/v4/accounts/__sprott__cloudflare__cloudflare_account_id__/tokens/verify" \\
    -H "Authorization: Bearer __sprott__cloudflare__cloudflare_api_token__"
Covers the whole v4 API (DNS, Workers, R2, ...) - scope the token to what you
need when you mint it. Zone IDs vary per request (/zones/<id>/...), so the agent
puts those straight in the URL.
"""

[service]
id = "cloudflare"
name = "Cloudflare"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["dev"]

hosts = ["api.cloudflare.com"]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://dash.cloudflare.com/profile/api-tokens"

# DNS record writes. The card lists the fields a request sets (a PATCH sets only
# some) and an approval binds them, so an approved change can't be replayed
# with a different target. comment and tags are left out: they don't change
# what the record answers. A change to a record and a new record are two
# shapes: a POST under a record's path (`dns_records/import`, a BIND file) is
# not a record write.
[requests.dns_record]
method = ["PUT", "PATCH"]
path = "/client/v4/zones/:zone/dns_records/:record"
scope = [
  "request.body.type", "request.body.name", "request.body.content", "request.body.data",
  "request.body.priority", "request.body.proxied", "request.body.ttl", "request.body.settings",
  "request.body.private_routing",
]

[requests.dns_record_create]
method = "POST"
path = "/client/v4/zones/:zone/dns_records"
scope = [
  "request.body.type", "request.body.name", "request.body.content", "request.body.data",
  "request.body.priority", "request.body.proxied", "request.body.ttl", "request.body.settings",
  "request.body.private_routing",
]

# One batch request deletes, updates, overwrites and creates records, in that
# order.
[requests.dns_batch]
method = "POST"
path = "/client/v4/zones/:zone/dns_records/batch"
scope = ["request.body.deletes", "request.body.patches", "request.body.puts", "request.body.posts"]
