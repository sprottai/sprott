# Google Cloud policy. One cloud-platform token reaches every GCP API; the token
# never enters the agent and egress is host-anchored, so routine work — listing,
# creating, updating, deploying (Cloud Run, Functions), running BigQuery, reading
# logs/metrics — rides the write=allow floor. The approval gate is spent only on
# the few irreversible / credential-escaping actions below. Each rule is a
# per-connection console toggle; loosen, split, or add your own (e.g. gate GKE
# cluster delete, or an IAM setIamPolicy that grants roles).
#
# Deliberately NOT gated: object deletes (DELETE /storage/v1/b/:bucket/o/:object
# — daily file churn), stop / reset / resize (POST actions, recoverable), disk
# deletes. Each rule's path is segment-counted (`:name` is exactly one segment)
# to hit exactly its target — a bucket delete, not an object delete; a project
# delete, not a sub-resource delete.

[default]
read = "allow"
write = "allow"

# ── Destroy a whole project (takes every resource + all data, no undo) ────────
# `/:version/projects/:project` = exactly 3 segments → the Resource Manager project delete
# (/v1|/v3/projects/<id>); every sub-resource DELETE is a longer path and rides
# the floor.
[[rule]]
id = "delete-project"
label = "Delete a project (destroys every resource and all its data)"
method = "DELETE"
path = "/:version/projects/:project"
level = "ask-always"

# ── Delete a VM (loses the instance and its boot disk) ────────────────────────
[[rule]]
id = "delete-instance"
label = "Delete a Compute Engine VM"
# `/compute/:version/`: v1, beta and alpha all delete the same VM.
method = "DELETE"
path = "/compute/:version/projects/:project/zones/:zone/instances/:instance"
level = "ask-always"

# ── Delete a storage bucket (loses every object in it) ────────────────────────
# `:bucket` = one segment, so this catches the bucket, not object deletes
# (DELETE /storage/v1/b/<bucket>/o/<object>, which has more segments). The
# Cloud Storage XML API deletes a bucket as DELETE /<bucket> on the same host
# and token; no other GCP API here has a one-segment path.
[[rule]]
id = "delete-bucket"
label = "Delete a Cloud Storage bucket (loses all its objects)"
method = "DELETE"
path = ["/storage/v1/b/:bucket", "/:bucket"]
level = "ask-always"

# ── Mint a service-account KEY (a durable credential Sprott never sees) ──────
# A downloadable SA key is a direct end-run around credential separation — the
# agent minting one escapes the broker. Rare, so gating it costs nothing daily.
[[rule]]
id = "mint-sa-key"
label = "Create a service-account key (a durable credential outside the broker)"
method = "POST"
path = "/v1/projects/:project/serviceAccounts/:account/keys"
level = "ask-always"
