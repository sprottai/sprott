# Google Tasks policy. Token never enters the agent; egress is host-anchored.
# Creating/editing/completing tasks rides the write floor. The one operation
# worth a look is deleting a whole task list, which drops every task under it in
# a single call. Deleting individual tasks stays on the floor (low blast radius).

[default]
read = "allow"
write = "allow"

# ── Lose a batch of work in one call ─────────────────────────────────────────
[[rule]]
id = "delete-tasklist"
label = "Delete a task list (drops all its tasks)"
label_zh = "删除任务列表（连同其中所有任务）"
consent = "Delete this task list and every task in it."
consent_zh = "删除这个任务列表及其中的所有任务。"
method = "DELETE"
path = "/tasks/v1/users/@me/lists/:tasklist"
level = "ask"

[[rule]]
id = "clear-tasks"
label = "Clear all completed tasks from a list"
label_zh = "清除列表中所有已完成的任务"
consent = "Clear all completed tasks from this list."
consent_zh = "清除这个列表中所有已完成的任务。"
method = "POST"
path = "/tasks/v1/lists/:tasklist/clear"
level = "ask"
