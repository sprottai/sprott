# Vercel policy. The token never enters the agent and egress is host-anchored, so
# routine work (reads, deploys, config, env changes) rides the write floor. The
# gate is spent on the few that destroy infrastructure, change who can get in,
# or open an exfil path. Each rule is a per-connection console toggle.
#
# Paths carry Vercel's version prefix (/v9, /v13, …); a `:version` segment in
# that place keeps a rule valid across version bumps (`:name` = exactly one
# path segment).

[default]
read = "allow"
write = "allow"

# ── Destroy (irreversible) ───────────────────────────────────────────────────
[[rule]]
id = "delete-project"
label = "Delete a project"
method = "DELETE"
path = "/:version/projects/:project"
level = "ask-always"

[[rule]]
id = "delete-deployment"
label = "Delete a deployment"
method = "DELETE"
path = "/:version/deployments/:deployment"
level = "ask"

[[rule]]
id = "delete-domain"
label = "Remove a domain"
method = "DELETE"
path = "/:version/domains/:domain"
level = "ask-always"

# ── Change who can get in (access posture) ───────────────────────────────────
[[rule]]
id = "remove-member"
label = "Remove a team member"
method = "DELETE"
path = "/:version/teams/:team/members/:member"
level = "ask-always"

[[rule]]
id = "change-member"
label = "Invite a team member or change a member's role"
method = ["POST", "PATCH"]
path = ["/:version/teams/:team/members", "/:version/teams/:team/members/:member"]
level = "ask-always"

# ── Supply chain / exfil (a webhook streams project events to an outside URL) ─
[[rule]]
id = "create-webhook"
label = "Create a webhook"
method = "POST"
path = "/:version/webhooks"
level = "ask-always"

[[rule]]
id = "delete-integration"
label = "Remove an integration configuration"
method = "DELETE"
path = "/:version/integrations/configuration/:configuration"
level = "ask"
