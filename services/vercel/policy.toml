# Vercel policy. The token never enters the agent and egress is host-anchored, so
# routine work (reads, deploys, config, env changes) rides the write floor. The
# gate is spent on the few that destroy infrastructure, change who can get in,
# or open an exfil path. Each rule is a per-connection console toggle.
#
# Paths carry Vercel's version prefix (/v9, /v13, …); a `:version` segment in
# that place keeps a rule valid across version bumps (`:name` = exactly one
# path segment).

[default]
read = "allow"
write = "allow"

# ── Destroy (irreversible) ───────────────────────────────────────────────────
[[rule]]
id = "delete-project"
label = "Delete a project"
label_zh = "删除项目"
consent = "Delete this Vercel project and all its deployments."
consent_zh = "删除这个 Vercel 项目及其全部部署。"
method = "DELETE"
path = "/:version/projects/:project"
level = "ask-always"

[[rule]]
id = "delete-deployment"
label = "Delete a deployment"
label_zh = "删除一次部署"
consent = "Delete this deployment. Its URL stops working."
consent_zh = "删除这次部署，它的 URL 将无法访问。"
method = "DELETE"
path = "/:version/deployments/:deployment"
level = "ask"

[[rule]]
id = "delete-domain"
label = "Remove a domain"
label_zh = "移除域名"
consent = "Remove this domain from Vercel. Projects using it stop being served at that address."
consent_zh = "从 Vercel 移除这个域名，用它的项目将无法再通过这个地址访问。"
method = "DELETE"
path = "/:version/domains/:domain"
level = "ask-always"

# ── Change who can get in (access posture) ───────────────────────────────────
[[rule]]
id = "remove-member"
label = "Remove a team member"
label_zh = "移除团队成员"
consent = "Remove this member from the team."
consent_zh = "把这位成员移出团队。"
method = "DELETE"
path = "/:version/teams/:team/members/:member"
level = "ask-always"

[[rule]]
id = "change-member"
label = "Invite a team member or change a member's role"
label_zh = "邀请团队成员或修改成员角色"
consent = "Invite people to this team, or change a member's role or access."
consent_zh = "邀请他人加入这个团队，或修改成员的角色和权限。"
method = ["POST", "PATCH"]
path = ["/:version/teams/:team/members", "/:version/teams/:team/members/:member"]
level = "ask-always"

# ── Supply chain / exfil (a webhook streams project events to an outside URL) ─
[[rule]]
id = "create-webhook"
label = "Create a webhook"
label_zh = "创建 webhook"
consent = "Add a webhook that sends Vercel events to {{ request.body.url }}."
consent_zh = "添加一个 webhook，把 Vercel 事件发送到 {{ request.body.url }}。"
method = "POST"
path = "/:version/webhooks"
level = "ask-always"

[[rule]]
id = "delete-integration"
label = "Remove an integration configuration"
label_zh = "移除集成配置"
consent = "Remove this integration and its access to your projects."
consent_zh = "移除这个集成及其对你项目的访问权限。"
method = "DELETE"
path = "/:version/integrations/configuration/:configuration"
level = "ask"
