# Snaplii policy (A2M API, aipayment.snaplii.com/v2). The api key and the
# minted JWT never enter the agent and egress is host-anchored, so browsing
# the catalog, quoting a price, and checking the balance ride the allow floor.
# The gate is spent where the money moves: a purchase is an irreversible spend
# of pre-funded wallet balance. Snaplii's own per-key daily cap backstops
# whatever this file misses; the two layers are complementary (their cap
# bounds the total, our gate approves each spend).
#
# Paths and fields below are Snaplii's OpenAPI spec (github.com/Snaplii-Inc/
# agent-to-merchant-payments, openapi.yaml v0.20.2). A bill is paid through
# POST /v2/purchase with orderType BILL_PAY, so the purchase gates cover it.

[default]
read = "allow"
write = "allow"

# ── Spend wallet balance (irreversible) ──────────────────────────────────────
# The quote (POST /v2/quote) deliberately stays on the floor: it prices a cart
# without committing anything — gating it would put friction on the browse
# loop while the purchase itself is already gated.
# Small-value convenience, big-value confirmation — the contactless-payment
# social norm (no-verification ceilings: US ~$100, EU €50, UK £100). A purchase
# at or under the threshold is `ask` (approve once, then a reuse window), and
# it is BOUND to its exact order, payment and delivery (service.toml
# `[requests.purchase]`), so approving a $40 gift card can't be ridden by a
# $75 bill payment or a gift to someone else (a different value re-prompts). Over the threshold
# escalates to `ask-always` (every spend confirmed, single-use). To make even
# small purchases frictionless (no tap at all), set this base to `allow`.
[[rule]]
id = "purchase"
label = "Buy a gift card or pay a bill (spends wallet balance)"
method = "POST"
path = "/v2/purchase"
level = "ask"

# Over the small-value ceiling, confirm every spend. Composes by most-
# restrictive-wins (a purchase over the threshold matches both rules →
# ask-always beats ask). The price is a decimal string in Snaplii's API; a
# price that is missing, not a string, or not plain decimal digits is
# confirmed every time too, since this rule can't tell how a server reads it.
[[rule]]
id = "purchase-large"
label = "Confirm a purchase over $100"
method = "POST"
path = "/v2/purchase"
condition = "!has(request.body.orderInfo) || !has(request.body.orderInfo.item) || !has(request.body.orderInfo.item.price) || type(request.body.orderInfo.item.price) != string || !request.body.orderInfo.item.price.matches('^[0-9]{1,8}([.][0-9]{1,2})?$') || double(request.body.orderInfo.item.price) > 100.0"
level = "ask-always"

# A P2P transfer sends wallet balance to a phone number: confirm every one,
# bound to the recipient, amount and note.
[[rule]]
id = "transfer"
label = "Send money to a phone number"
method = "POST"
path = "/v2/transfers"
level = "ask-always"
