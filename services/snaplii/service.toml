setup = """
Snaplii pays real merchants (gift cards, bill pay) from a pre-funded wallet.
Put the phantom in the bearer header; the broker exchanges the stored api key
for a short-lived JWT at egress — neither ever enters the agent:
  sprott run -- curl https://aipayment.snaplii.com/v2/balance \\
    -H "Authorization: Bearer __sprott__snaplii__"
Purchases (POST /v2/purchase) and transfers (POST /v2/transfers) ask for
approval by default.
"""

[service]
id = "snaplii"
name = "Snaplii"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["payment"]

# One AI-payment api key (snp_sk_live_…, minted in the Snaplii app under
# More → Payment Methods → AI Payment Management) backs the whole A2M API.
# The key can SPEND (within its Snaplii-side per-key daily cap) — it is the
# mint input of `[auth] type = "snaplii"` and never injectable; the agent only
# ever holds the phantom.
hosts = ["aipayment.snaplii.com"]
secrets = ["SNAPLII_API_KEY"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://www.snaplii.com/a2m/"

# Snaplii's key→JWT exchange is a bespoke envelope (no OAuth grant, no RFC
# field names), so it is a code built-in — see src/auth/snaplii.rs — and this
# section carries no config. The connection id is the agent label Snaplii sees.
[auth]
type = "snaplii"

# Request shapes: the fields that say what money moves become part of what the
# user approves. Field names are Snaplii's OpenAPI spec (agent-to-merchant-
# payments openapi.yaml, v0.20.2): a purchase is `orderInfo.item` with `price`
# as a decimal string ("50.00") and `orderType` GIFT_CARD or BILL_PAY; a
# transfer is `to_phone` + `amount` (decimal string). An approval binds the
# whole order, payment and delivery, so approving one purchase can't be
# replayed as another item, price, recipient (a gift order) or payment method.
[requests.purchase]
method = "POST"
path = "/v2/purchase"
scope = [
  "request.body.orderInfo.orderType", "request.body.orderInfo.item.itemId",
  "request.body.orderInfo.item.price", "request.body.orderInfo",
  "request.body.paymentContext", "request.body.delivery",
]
consent = "Buy {{ request.body.orderInfo.item.itemId }} ({{ request.body.orderInfo.orderType }}) for {{ request.body.orderInfo.item.price }}"

# A P2P transfer sends wallet balance to a phone number once its short undo
# window ends.
[requests.transfer]
method = "POST"
path = "/v2/transfers"
scope   = ["request.body.to_phone", "request.body.amount", "request.body.remark"]
consent = "Send {{ request.body.amount }} to {{ request.body.to_phone }}"
