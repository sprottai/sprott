# CircleCI policy. The token never enters the agent and egress is host-anchored,
# so routine reads (pipelines, jobs, workflows, insights, env-var listing) ride
# the floor. The gate is spent where CI code runs or reads planted values, and
# where a deploy or a project's trust settings change: triggering, continuing
# or rerunning a pipeline, scheduling one, changing which config it runs,
# approving a held job, rolling back, writing an env var or key the build will
# read, changing project settings or OIDC token claims, and lifting a context
# restriction. Each rule is a per-connection console toggle; loosen or tighten
# to taste.
#
# Endpoints are CircleCI API v2 (https://circleci.com/api/v2/openapi.json). A
# project slug is `vcs-slug/org-name/repo-name` and either `/` may be
# URL-escaped, so a slug spans one, two or three path segments:
# `:vcs{/:org}?{/:project}?` (an escaped `/` stays inside its segment). The
# project endpoints CircleCI still documents under API v1.1 on the same host
# (https://circleci.com/docs/api/v1/) are covered alongside their v2
# counterparts; their `:vcs-type/:username/:project` is matched the same way.

# CircleCI's API reads a `_method` field from a form or multipart POST body and
# routes the request to that method's handler (probed 2026-10-29), so every
# gate on PATCH, PUT or DELETE also lists the POST spelling of its path.

[default]
read = "allow"
write = "allow"

# ── Supply chain / code execution ────────────────────────────────────────────
[[rule]]
id = "trigger-pipeline"
label = "Trigger, continue or rerun a pipeline or job (runs CI code)"
method = "POST"
path = [
  "/api/v2/project/:vcs{/:org}?{/:project}?/pipeline",
  "/api/v2/project/:vcs{/:org}?{/:project}?/pipeline/run",
  "/api/v2/pipeline/continue",
  "/api/v2/workflow/:workflow/rerun",
  # v1.1: trigger a job, a job on a branch, a pipeline; retry a job.
  "/api/v1.1/project/:vcs{/:org}?{/:project}?",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/tree/*",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/build",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/:build_num/retry",
]
level = "ask"

[[rule]]
id = "job-ssh"
label = "Rerun a job with SSH access, or give a user SSH access to a job"
method = "POST"
path = [
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/:build_num/ssh",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/:build_num/ssh-users",
]
level = "ask"

[[rule]]
id = "schedule-pipeline"
label = "Create or change a pipeline schedule or trigger"
method = ["POST", "PATCH"]
path = [
  "/api/v2/project/:vcs{/:org}?{/:project}?/schedule",
  "/api/v2/schedule/:schedule",
  "/api/v2/projects/:project_id/pipeline-definitions/:definition/triggers",
  "/api/v2/projects/:project_id/triggers/:trigger",
]
level = "ask"

[[rule]]
id = "pipeline-definition"
label = "Create or change a pipeline definition (which config a project runs)"
method = ["POST", "PATCH"]
path = [
  "/api/v2/projects/:project_id/pipeline-definitions",
  "/api/v2/projects/:project_id/pipeline-definitions/:definition",
]
level = "ask"

# ── Deploys ──────────────────────────────────────────────────────────────────
[[rule]]
id = "approve-job"
label = "Approve a job that is waiting for approval (can release a held deploy)"
method = "POST"
path = "/api/v2/workflow/:workflow/approve/:approval"
level = "ask"

[[rule]]
id = "rollback-project"
label = "Roll back a project (runs its rollback pipeline)"
method = "POST"
path = "/api/v2/projects/:project_id/rollback"
level = "ask"

# ── Plant a secret or key the build will read ────────────────────────────────
[[rule]]
id = "create-env-var"
label = "Create or overwrite a project or context environment variable"
method = ["POST", "PUT"]
path = [
  "/api/v2/project/:vcs{/:org}?{/:project}?/envvar",
  "/api/v2/context/:context/environment-variable/:name",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/envvar",
]
level = "ask"

[[rule]]
id = "add-project-key"
label = "Add a checkout key or SSH key to a project"
method = "POST"
path = [
  "/api/v2/project/:vcs{/:org}?{/:project}?/checkout-key",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/checkout-key",
  "/api/v1.1/project/:vcs{/:org}?{/:project}?/ssh-key",
]
level = "ask"

# ── Project and organization trust settings ──────────────────────────────────
[[rule]]
id = "project-settings"
label = "Change a project's advanced settings"
method = ["PATCH", "POST"]
path = "/api/v2/project/:vcs{/:org}?{/:project}?/settings"
level = "ask"

[[rule]]
id = "oidc-claims"
label = "Change the custom claims in CircleCI's OIDC tokens for an organization or project"
method = ["PATCH", "POST", "DELETE"]
path = [
  "/api/v2/org/:org_id/oidc-custom-claims",
  "/api/v2/org/:org_id/project/:project_id/oidc-custom-claims",
]
level = "ask"

# Removing a restriction widens who can use the context's secrets, so unlike
# other removals it does not ride the floor.
[[rule]]
id = "remove-context-restriction"
label = "Remove a restriction on who can use a context"
method = ["DELETE", "POST"]
path = "/api/v2/context/:context/restrictions/:restriction"
level = "ask"
