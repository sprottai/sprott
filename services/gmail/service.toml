[service]
id = "gmail"
name = "Gmail"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["app"]

hosts = ["gmail.googleapis.com"]
secrets = ["GMAIL_REFRESH_TOKEN"]

# A send is covered whole: its body is only `raw` and `threadId`. `raw` is an
# email (base64url, as Google reads protobuf bytes), covered by its content,
# so a client that re-builds the same email with a fresh boundary, `Date` and
# `Message-ID` redeems its approval.
[requests.send]
method = "POST"
path = "/gmail/v1/users/:user/messages/send"
encoded."request.body.raw" = { contentEncoding = "base64url", contentMediaType = "message/rfc822" }
# The `email` filter (console code, like git's `| basic`) decodes `raw` into a
# legible From/To/Subject/Body card, raw under Advanced Details. Same pipe
# syntax as `{{ secret.X | basic }}`.
consent = "{{ request.body.raw | email }}"

# A draft sent by its id alone: the card names the draft.
[requests.draft_send_by_id]
method = "POST"
path = "/gmail/v1/users/:user/drafts/send"
condition = "!has(request.body.message)"
consent = "Send draft {{ request.body.id }}"

[requests.draft_send]
method = "POST"
path = "/gmail/v1/users/:user/drafts/send"
encoded."request.body.message.raw" = { contentEncoding = "base64url", contentMediaType = "message/rfc822" }
consent = "{{ request.body.message.raw | email }}"

[auth]
type = "oauth2"
# Display label only ("Connect with Google") — carries no config.
provider = "google"
scopes = [
  "https://www.googleapis.com/auth/gmail.send",
  "https://www.googleapis.com/auth/gmail.readonly",
  "https://www.googleapis.com/auth/gmail.modify",
]
refresh_token = "GMAIL_REFRESH_TOKEN"

# ── Shared Google Desktop OAuth client (same client in gmail/gdrive/gcalendar —
# rotate all three together; this file holds the canonical rationale) ──
#
# This ships the PUBLIC Desktop OAuth client. Google's Desktop-app design treats
# this client_secret as NON-confidential — "the client secret is obviously not
# treated as a secret"
# (developers.google.com/identity/protocols/oauth2/native-app) — because an
# installed app lives on the user's machine and cannot keep secrets. The real
# security is PKCE + the user's live Google login, not this string.
#
# Why it's committed, and why it CANNOT be dropped in favor of pure PKCE:
#  - Google's Desktop client REQUIRES client_secret at the token endpoint even
#    WITH PKCE. Verified empirically (2026-06): omitting it returns
#    `invalid_request: "client_secret is missing."`. The docs' "Optional" does
#    NOT apply to the Desktop client type — so the secret must ship here.
#  - GitHub push-protection flags the `GOCSPX-` pattern; this specific value is
#    allow-listed as a public Desktop client (non-confidential), NOT a leak.
#
# The CONFIDENTIAL Web-app client_secret (our cloud asset) must NEVER appear in
# any recipe — a literal client_secret in a definition is by convention a
# public client's (review-enforced; the old client_type = "public" assertion
# field was retired as theater: tooling stamped it automatically).
authorization_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url         = "https://oauth2.googleapis.com/token"
pkce              = true
client_id         = "93304174941-3063aq5fi6tli703891896vedspuhpfn.apps.googleusercontent.com"
client_secret     = "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"
redirect_uri      = "http://127.0.0.1:8765/safeclaw/oauth/callback"

# Google-specific consent-URL params: without access_type=offline +
# prompt=consent a repeat consent returns no refresh_token.
[auth.authorize_params]
access_type = "offline"
prompt      = "consent"
