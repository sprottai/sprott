# Gmail policy. Reading, labelling, drafting, archiving and trashing mail go
# through; only deleting mail for good asks. Sending is a switch on each
# connection: `send-email` and `send-draft` sit at "allow"; set them to
# "ask-always" to approve every email, and the card shows that email.
# See docs/POLICY.md.

[default]
read = "allow"
write = "allow"

[[rule]]
id = "list-emails"
label = "List emails"
method = "GET"
path = "/gmail/v1/users/:user/messages"
level = "allow"

[[rule]]
id = "list-labels"
label = "List labels"
method = "GET"
path = "/gmail/v1/users/:user/labels"
level = "allow"

[[rule]]
id = "read-email"
label = "Read email content"
method = "GET"
path = "/gmail/v1/users/:user/messages/:message"
level = "allow"

[[rule]]
id = "send-email"
label = "Send email"
method = "POST"
path = [
  "/gmail/v1/users/:user/messages/send",
  "/upload/gmail/v1/users/:user/messages/send",
  "/resumable/upload/gmail/v1/users/:user/messages/send",
]
level = "allow"

[[rule]]
id = "send-draft"
label = "Send a draft"
method = "POST"
path = [
  "/gmail/v1/users/:user/drafts/send",
  "/upload/gmail/v1/users/:user/drafts/send",
  "/resumable/upload/gmail/v1/users/:user/drafts/send",
]
level = "allow"

[[rule]]
id = "modify-email"
label = "Modify labels / archive / trash"
method = "POST"
path = "/gmail/v1/users/:user/messages/:message/modify"
level = "allow"

# Skips Trash and can't be undone. Needs the full-mail scope the connection
# doesn't request today; kept because it is the one destructive mail call.
[[rule]]
id = "delete-email"
label = "Delete email permanently (skips Trash)"
method = "DELETE"
path = ["/gmail/v1/users/:user/messages/:message", "/gmail/v1/users/:user/threads/:thread"]
level = "ask-always"
