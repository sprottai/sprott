# Gmail policy. Reading, labelling, drafting, archiving and trashing mail go
# through; only deleting mail for good asks. Sending is a switch on each
# connection: `send-email` and `send-draft` sit at "allow"; set them to
# "ask-always" to approve every email, and the card shows that email.
# See docs/POLICY.md.

[default]
read = "allow"
write = "allow"

[[rule]]
id = "list-emails"
label = "List emails"
label_zh = "列出邮件"
consent = "List emails in this mailbox."
consent_zh = "列出这个邮箱里的邮件。"
method = "GET"
path = "/gmail/v1/users/:user/messages"
level = "allow"

[[rule]]
id = "list-labels"
label = "List labels"
label_zh = "列出标签"
consent = "List this mailbox's labels."
consent_zh = "列出这个邮箱的标签。"
method = "GET"
path = "/gmail/v1/users/:user/labels"
level = "allow"

[[rule]]
id = "read-email"
label = "Read email content"
label_zh = "读取邮件内容"
consent = "Read this email."
consent_zh = "读取这封邮件。"
method = "GET"
path = "/gmail/v1/users/:user/messages/:message"
level = "allow"

[[rule]]
id = "send-email"
label = "Send email"
label_zh = "发送邮件"
consent = "Send an email from this account."
consent_zh = "用这个账号发送一封邮件。"
method = "POST"
path = [
  "/gmail/v1/users/:user/messages/send",
  "/upload/gmail/v1/users/:user/messages/send",
  "/resumable/upload/gmail/v1/users/:user/messages/send",
]
level = "allow"

[[rule]]
id = "send-draft"
label = "Send a draft"
label_zh = "发送草稿"
consent = "Send a draft from this account."
consent_zh = "用这个账号发送一份草稿。"
method = "POST"
path = [
  "/gmail/v1/users/:user/drafts/send",
  "/upload/gmail/v1/users/:user/drafts/send",
  "/resumable/upload/gmail/v1/users/:user/drafts/send",
]
level = "allow"

[[rule]]
id = "modify-email"
label = "Modify labels / archive / trash"
label_zh = "修改标签、归档或移入已删除邮件"
consent = "Change this email's labels, which can archive it or move it to Trash."
consent_zh = "修改这封邮件的标签，可用于归档或移入已删除邮件。"
method = "POST"
path = "/gmail/v1/users/:user/messages/:message/modify"
level = "allow"

# Skips Trash and can't be undone. Needs the full-mail scope the connection
# doesn't request today; kept because it is the one destructive mail call.
[[rule]]
id = "delete-email"
label = "Delete email permanently (skips Trash)"
label_zh = "永久删除邮件（不进已删除邮件）"
consent = "Delete this email or thread for good. It skips Trash and can't be undone."
consent_zh = "永久删除这封邮件或这个会话，不进已删除邮件，无法撤销。"
method = "DELETE"
path = ["/gmail/v1/users/:user/messages/:message", "/gmail/v1/users/:user/threads/:thread"]
level = "ask-always"
