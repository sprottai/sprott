# GitHub policy. Routine developer work — issues, pull requests, comments,
# reviews, labels, merges, `git push`, creating releases, commit statuses /
# checks — flows freely: the token never enters the agent and egress is
# host-anchored, so the approval gate is spent only on the consequential few —
# operations that destroy work, change who can access a repo, or feed the CI /
# supply chain (which runs arbitrary code). Each rule is a per-connection
# override point in the console; loosen or tighten to taste.
#
# git-over-HTTPS (clone / fetch / push on github.com) is not a REST path and
# rides the write=allow floor — the phantom is substituted at egress, git never
# sees the token. Gating it would prompt on every git object request.

# Every repository route also answers as `/repositories/<id>/…` and every
# organization route as `/organizations/<id>/…`, and GitHub takes POST for
# PATCH, so each rule lists those spellings too.

[default]
read = "allow"
write = "allow"

# ── Destroy / lose work (irreversible) ───────────────────────────────────────
[[rule]]
id = "delete-repo"
label = "Delete repository"
match = ["DELETE /repos/*/*", "DELETE /repositories/*"]
level = "ask-always"

[[rule]]
id = "transfer-repo"
label = "Transfer repository to a new owner"
match = ["POST /repos/*/*/transfer", "POST /repositories/*/transfer"]
level = "ask-always"

# ── Change who can access (security posture) ─────────────────────────────────
[[rule]]
id = "make-public"
label = "Make repository public"
match = ["PATCH /repos/*/*", "PATCH /repositories/*", "POST /repos/*/*", "POST /repositories/*"]
when = "vars.private == false || vars.visibility == 'public'"
level = "ask-always"

[[rule]]
id = "add-collaborator"
label = "Add or change a collaborator"
match = ["PUT /repos/*/*/collaborators/*", "PUT /repositories/*/collaborators/*"]
level = "ask-always"

[[rule]]
id = "remove-collaborator"
label = "Remove a collaborator"
match = ["DELETE /repos/*/*/collaborators/*", "DELETE /repositories/*/collaborators/*"]
level = "ask-always"

[[rule]]
id = "set-branch-protection"
label = "Change branch protection (or rename a branch)"
# Protection settings take PUT, PATCH and POST on sub-resources
# (required_pull_request_reviews, restrictions/users, enforce_admins, …);
# POST also renames a branch (…/rename), which this gates too.
match = [
  "PUT /repos/*/*/branches/**", "PUT /repositories/*/branches/**",
  "PATCH /repos/*/*/branches/**", "PATCH /repositories/*/branches/**",
  "POST /repos/*/*/branches/**", "POST /repositories/*/branches/**",
]
level = "ask-always"

[[rule]]
id = "remove-branch-protection"
label = "Remove branch protection"
match = ["DELETE /repos/*/*/branches/**", "DELETE /repositories/*/branches/**"]
level = "ask-always"

[[rule]]
id = "change-ruleset"
label = "Create, change or delete a ruleset"
match = [
  "POST /repos/*/*/rulesets", "PUT /repos/*/*/rulesets/*", "DELETE /repos/*/*/rulesets/*",
  "POST /repositories/*/rulesets", "PUT /repositories/*/rulesets/*", "DELETE /repositories/*/rulesets/*",
  "POST /orgs/*/rulesets", "PUT /orgs/*/rulesets/*", "DELETE /orgs/*/rulesets/*",
  "POST /organizations/*/rulesets", "PUT /organizations/*/rulesets/*", "DELETE /organizations/*/rulesets/*",
]
level = "ask-always"

[[rule]]
id = "change-org-access"
label = "Change who is in an organization or a team, or a team's access to a repository"
match = [
  "PUT /orgs/*/memberships/*", "DELETE /orgs/*/memberships/*", "DELETE /orgs/*/members/*",
  "POST /orgs/*/invitations",
  "PUT /orgs/*/outside_collaborators/*", "DELETE /orgs/*/outside_collaborators/*",
  "PUT /orgs/*/teams/*/memberships/*", "DELETE /orgs/*/teams/*/memberships/*",
  "PUT /orgs/*/teams/*/repos/*/*", "DELETE /orgs/*/teams/*/repos/*/*",
  "PUT /teams/*/repos/*/*", "DELETE /teams/*/repos/*/*",
  "PUT /organizations/*/memberships/*", "DELETE /organizations/*/memberships/*", "DELETE /organizations/*/members/*",
  "POST /organizations/*/invitations",
  "PUT /organizations/*/outside_collaborators/*", "DELETE /organizations/*/outside_collaborators/*",
  "PUT /organizations/*/teams/*/memberships/*", "DELETE /organizations/*/teams/*/memberships/*",
  "PUT /organizations/*/teams/*/repos/*/*", "DELETE /organizations/*/teams/*/repos/*/*",
]
level = "ask-always"

[[rule]]
id = "add-deploy-key"
label = "Add a deploy key"
match = ["POST /repos/*/*/keys", "POST /repositories/*/keys"]
level = "ask-always"

# ── Supply chain / code execution (CI runs arbitrary code; exfil surface) ────
[[rule]]
id = "add-webhook"
label = "Add a webhook"
match = ["POST /repos/*/*/hooks", "POST /repositories/*/hooks", "POST /orgs/*/hooks", "POST /organizations/*/hooks"]
level = "ask-always"

[[rule]]
id = "edit-webhook"
label = "Edit a webhook"
match = [
  "PATCH /repos/*/*/hooks/*", "PATCH /repositories/*/hooks/*", "POST /repos/*/*/hooks/*", "POST /repositories/*/hooks/*",
  "PATCH /repos/*/*/hooks/*/config", "PATCH /repositories/*/hooks/*/config",
  "PATCH /orgs/*/hooks/*", "PATCH /orgs/*/hooks/*/config", "PATCH /organizations/*/hooks/*", "PATCH /organizations/*/hooks/*/config",
]
level = "ask-always"

[[rule]]
id = "set-actions-secret"
label = "Set a repository secret (Actions, Dependabot, Codespaces, agents, environments)"
# `/repos/*/*/*/secrets/*`: the third segment is actions, dependabot,
# codespaces or agents; each kind is read by code that runs for the repo.
match = [
  "PUT /repos/*/*/*/secrets/*", "PUT /repositories/*/*/secrets/*",
  "PUT /repos/*/*/environments/*/secrets/*", "PUT /repositories/*/environments/*/secrets/*",
]
level = "ask-always"

[[rule]]
id = "set-org-actions-secret"
label = "Set an org or user secret, or which repositories can read it"
# `/orgs/*/*/secrets/*`: actions, dependabot, codespaces or agents. The
# `repositories` sub-paths decide which repositories can read the secret.
match = [
  "PUT /orgs/*/*/secrets/*", "PUT /orgs/*/*/secrets/*/repositories", "PUT /orgs/*/*/secrets/*/repositories/*",
  "PUT /organizations/*/*/secrets/*", "PUT /organizations/*/*/secrets/*/repositories", "PUT /organizations/*/*/secrets/*/repositories/*",
  "PUT /user/codespaces/secrets/*", "PUT /user/codespaces/secrets/*/repositories", "PUT /user/codespaces/secrets/*/repositories/*",
]
level = "ask-always"

[[rule]]
id = "dispatch-workflow"
label = "Trigger a workflow run"
match = ["POST /repos/*/*/actions/workflows/*/dispatches", "POST /repositories/*/actions/workflows/*/dispatches"]
level = "ask-always"

[[rule]]
id = "repo-dispatch"
label = "Trigger a repository_dispatch event"
match = ["POST /repos/*/*/dispatches", "POST /repositories/*/dispatches"]
level = "ask-always"

[[rule]]
id = "register-runner"
label = "Register a self-hosted runner"
match = [
  "POST /repos/*/*/actions/runners/registration-token", "POST /repositories/*/actions/runners/registration-token",
  "POST /repos/*/*/actions/runners/generate-jitconfig", "POST /repositories/*/actions/runners/generate-jitconfig",
  "POST /orgs/*/actions/runners/registration-token", "POST /organizations/*/actions/runners/registration-token",
  "POST /orgs/*/actions/runners/generate-jitconfig", "POST /organizations/*/actions/runners/generate-jitconfig",
]
level = "ask-always"

# ── Deletions that are recoverable → ask once, cached for the window ──────────
[[rule]]
id = "delete-branch"
label = "Delete a branch or tag"
match = ["DELETE /repos/*/*/git/refs/**", "DELETE /repositories/*/git/refs/**"]
level = "ask"

[[rule]]
id = "delete-release"
label = "Delete a release"
match = ["DELETE /repos/*/*/releases/*", "DELETE /repositories/*/releases/*"]
level = "ask"

# ── The same gates over GraphQL ──────────────────────────────────────────────
# Mutation names from GitHub's public schema (docs.github.com/public/fpt/
# schema.docs.graphql, 2026-10-27). Each is the GraphQL spelling of a REST
# gate above: branch protection and rulesets, who can access, deleting a ref
# (`updateRefs` deletes a ref when its `afterOid` is all zeros, and moves refs
# in bulk otherwise).
[[rule]]
id = "graphql-gated-mutations"
label = "Change branch protection or rulesets, change who can access, or delete a branch (GraphQL)"
match = "POST /graphql"
when = "vars.fields.exists(f, f in ['createBranchProtectionRule', 'updateBranchProtectionRule', 'deleteBranchProtectionRule', 'createRepositoryRuleset', 'updateRepositoryRuleset', 'deleteRepositoryRuleset', 'updateTeamsRepository', 'removeOutsideCollaborator', 'deleteRef', 'updateRefs', 'addEnterpriseOrganizationMember'])"
level = "ask-always"
