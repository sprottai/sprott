setup = """
git over HTTPS (SSH is outside the broker): put the phantom in the URL as the
credential — token in the password slot, any dummy user — so no pre-existing git
credential helper can shadow it:
  sprott run -- git clone https://x-access-token:__sprott__github__@github.com/<owner>/<repo>
Same shape for remote add / push / fetch. Multi-account: switch the phantom value
(__sprott__github_work__).
"""

[service]
id = "github"
name = "GitHub"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["dev"]

# One GitHub connection (one PAT) backs both the REST API (api.github.com) and
# git-over-HTTPS (github.com). Basic self-describes on the wire — no auth section.
hosts = ["api.github.com", "github.com"]
secrets = ["GITHUB_TOKEN"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://github.com/settings/tokens?type=beta"

# A repository settings change. An approval covers the whole request (its
# make-public condition reads the visibility fields from the body).
[requests.repo_settings]
method = ["PATCH", "POST"]
path = ["/repos/:owner/:repo", "/repositories/:repository_id"]

# A secret's value is sealed afresh on every run (a sealed box to the
# repository's public key), so an approval covers which secret and who can
# read it: the path, the key it is sealed to, its visibility and its
# repositories.
[requests.secrets]
method = "PUT"
path = [
  "/repos/:owner/:repo/:kind/secrets/:secret_name",
  "/repositories/:repository_id/:kind/secrets/:secret_name",
  "/repos/:owner/:repo/environments/:environment/secrets/:secret_name",
  "/repositories/:repository_id/environments/:environment/secrets/:secret_name",
  "/orgs/:org/:kind/secrets/:secret_name",
  "/organizations/:org_id/:kind/secrets/:secret_name",
  "/user/codespaces/secrets/:secret_name",
]
scope = ["request.body.key_id", "request.body.visibility", "request.body.selected_repository_ids"]

# The GraphQL API reaches the same consequential actions as the REST routes
# above. Policy decides on the called mutations; an approval binds the calls.
[requests.graphql]
method = "POST"
path = "/graphql"
body = "graphql"
scope   = ["request.graphql.request", "request.graphql.calls", "request.graphql.fields"]
consent = "{{ request.graphql.calls | graphql }}"
