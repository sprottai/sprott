# Railway policy. The whole API is one GraphQL endpoint (POST /graphql/v2), so
# the read/write floor can't tell a query from a mutation — everything is POST.
# The token never enters the agent and egress is host-anchored, so routine work
# (deploys, variable/domain changes, redeploys, queries) rides the write=allow
# floor. The gate is spent only on the consequential few, matched by the called
# GraphQL field (`vars.fields`, read from the parsed request by service.toml's
# `[requests.graphql]`, which also refuses a request it can't read). Each rule is
# a per-connection console toggle; loosen or split to taste.

[default]
read = "allow"
write = "allow"

# Mutation names below are ground truth from GraphQL introspection against
# backboard.railway.com/graphql/v2 (2026-07-08, re-checked 2026-10-26), not
# guessed. A rule names each field exactly.

# ── Destroy / lose work (irreversible) ───────────────────────────────────────
# workspaceDelete is the biggest: it takes every project under the workspace.
[[rule]]
id = "delete-infra"
label = "Delete or overwrite a workspace, project, service, environment, volume or the account"
match = "POST /graphql/**"
when = "vars.fields.exists(f, f in ['workspaceDelete', 'projectDelete', 'serviceDelete', 'environmentDelete', 'volumeDelete', 'volumeInstanceBackupDelete', 'userDelete', 'projectScheduleDelete', 'projectScheduleDeleteForce', 'volumeInstanceBackupRestore', 'signalDelete', 'sandboxDestroy', 'templateDelete', 'cloudAgentDelete', 'integrationDelete', 'providerAuthRemove'])"
level = "ask-always"

# ── Mint a durable credential (escapes the broker) ───────────────────────────
# A new API token is a key Sprott never sees — the agent minting one via the
# API is a direct end-run around credential separation. Rare, so gating it costs
# nothing day to day.
# A service, volume or bucket can also be deleted through an environment
# config change (`isDeleted: true` in Railway's EnvironmentConfig schema,
# backboard.railway.com/schema/environment.schema.json), committed directly
# or staged first. `request` is the canonical JSON of the calls, so a key can't
# be spelled another way. environmentApplyChangeSet (experimental, free-form
# change set, schema unpublished) always asks.
[[rule]]
id = "delete-via-config"
label = "Delete a service, volume or bucket through an environment change"
match = "POST /graphql/**"
when = "vars.fields.exists(f, f == 'environmentApplyChangeSet') || vars.fields.exists(f, f in ['environmentPatchCommit', 'environmentStageChanges']) && vars.request.contains('\"isDeleted\":true')"
level = "ask-always"

[[rule]]
id = "mint-token"
label = "Mint an API or access token"
match = "POST /graphql/**"
when = "vars.fields.exists(f, f in ['projectTokenCreate', 'apiTokenCreate', 'clearanceTokenCreate'])"
level = "ask-always"

# ── Change who can get in (access posture) ───────────────────────────────────
# Adding/inviting a member, changing a role, transferring the project to a new
# owner, or adding an SSH key that grants shell into running containers. All rare,
# all consequential; matches github's collaborator / transfer / deploy-key gates.
[[rule]]
id = "change-access"
label = "Add or remove a member, change a role or a limit, transfer ownership, open a shell, reset credentials, or change sign-in security"
match = "POST /graphql/**"
when = "vars.fields.exists(f, f in ['projectMemberAdd', 'projectMemberUpdate', 'projectInviteUser', 'projectTransfer', 'projectTransferInitiate', 'projectTransferConfirm', 'workspaceUserInvite', 'workspaceInviteCodeCreate', 'workspacePermissionChange', 'accessGroupMemberAdd', 'accessGroupProjectAttach', 'sshPublicKeyCreate', 'generateShellToken', 'passkeyDelete', 'twoFactorInfoDelete', 'workspaceTwoFactorEnforcementUpdate', 'projectMemberRemove', 'projectLeave', 'workspaceUserRemove', 'workspaceLeave', 'workspaceInviteCodeUse', 'inviteCodeUse', 'accessGroupUpdate', 'accessGroupDelete', 'accessGroupMemberRemove', 'accessGroupProjectDetach', 'twoFactorInfoCreate', 'twoFactorInfoSecret', 'databasePasswordReset', 'bucketCredentialsReset', 'usageLimitRemove', 'sshSignupApprove', 'usageLimitSet', 'agentUsageLimitSet'])"
level = "ask-always"
