# Railway policy. The whole API is one GraphQL endpoint (POST /graphql/v2), so
# the read/write floor can't tell a query from a mutation — everything is POST.
# The token never enters the agent and egress is host-anchored, so routine work
# (deploys, variable/domain changes, redeploys, queries) rides the write=allow
# floor. The gate is spent only on the consequential few, matched by the called
# GraphQL field (`request.graphql.fields`, read from the parsed request, as
# service.toml's `[requests.graphql]` declares the body format; a request it
# can't read is refused). Each rule is a per-connection console toggle; loosen
# or split to taste.

[default]
read = "allow"
write = "allow"

# Mutation names below are ground truth from GraphQL introspection against
# backboard.railway.com/graphql/v2 (2026-07-08, re-checked 2026-10-26), not
# guessed. A rule names each field exactly.

# ── Destroy / lose work (irreversible) ───────────────────────────────────────
# workspaceDelete is the biggest: it takes every project under the workspace.
[[rule]]
id = "delete-infra"
label = "Delete or overwrite a workspace, project, service, environment, volume or the account"
label_zh = "删除或覆盖 workspace、项目、服务、环境、卷或账号"
consent = "Delete or overwrite something in Railway, such as a project, service, volume or the whole account."
consent_zh = "删除或覆盖 Railway 里的内容，比如项目、服务、卷或整个账号。"
method = "POST"
path = "/graphql/*"
condition = "request.graphql.fields.exists(f, f in ['workspaceDelete', 'projectDelete', 'serviceDelete', 'environmentDelete', 'volumeDelete', 'volumeInstanceBackupDelete', 'userDelete', 'projectScheduleDelete', 'projectScheduleDeleteForce', 'volumeInstanceBackupRestore', 'signalDelete', 'sandboxDestroy', 'templateDelete', 'cloudAgentDelete', 'integrationDelete', 'providerAuthRemove'])"
level = "ask-always"

# ── Mint a durable credential (escapes the broker) ───────────────────────────
# A new API token is a key Sprott never sees — the agent minting one via the
# API is a direct end-run around credential separation. Rare, so gating it costs
# nothing day to day.
# A service, volume or bucket can also be deleted through an environment
# config change (`isDeleted: true` in Railway's EnvironmentConfig schema,
# backboard.railway.com/schema/environment.schema.json), committed directly
# or staged first. `request.graphql.request` is the canonical JSON of the
# calls, so a key can't be spelled another way. environmentApplyChangeSet
# (experimental, free-form change set, schema unpublished) always asks.
[[rule]]
id = "delete-via-config"
label = "Delete a service, volume or bucket through an environment change"
label_zh = "通过修改环境配置删除服务、卷或存储桶"
consent = "Delete a service, volume or bucket by changing the environment's config."
consent_zh = "通过修改环境配置删除服务、卷或存储桶。"
method = "POST"
path = "/graphql/*"
condition = "request.graphql.fields.exists(f, f == 'environmentApplyChangeSet') || request.graphql.fields.exists(f, f in ['environmentPatchCommit', 'environmentStageChanges']) && request.graphql.request.contains('\"isDeleted\":true')"
level = "ask-always"

[[rule]]
id = "mint-token"
label = "Mint an API or access token"
label_zh = "创建 API token 或访问 token"
consent = "Create a Railway token. Whoever holds it can use Railway without going through Sprott."
consent_zh = "创建一个 Railway token，持有它的人可以不经 Sprott 直接使用 Railway。"
method = "POST"
path = "/graphql/*"
condition = "request.graphql.fields.exists(f, f in ['projectTokenCreate', 'apiTokenCreate', 'clearanceTokenCreate'])"
level = "ask-always"

# ── Change who can get in (access posture) ───────────────────────────────────
# Adding/inviting a member, changing a role, transferring the project to a new
# owner, or adding an SSH key that grants shell into running containers. All rare,
# all consequential; matches github's collaborator / transfer / deploy-key gates.
[[rule]]
id = "change-access"
label = "Add or remove a member, change a role or a limit, transfer ownership, open a shell, reset credentials, or change sign-in security"
label_zh = "添加或移除成员、修改角色或额度、转移所有权、开 shell、重置凭证，或修改登录安全设置"
consent = "Change who can get into this Railway account, workspace or project, or what they can do there."
consent_zh = "修改谁能进入这个 Railway 账号、workspace 或项目，或他们在其中能做什么。"
method = "POST"
path = "/graphql/*"
condition = "request.graphql.fields.exists(f, f in ['projectMemberAdd', 'projectMemberUpdate', 'projectInviteUser', 'projectTransfer', 'projectTransferInitiate', 'projectTransferConfirm', 'workspaceUserInvite', 'workspaceInviteCodeCreate', 'workspacePermissionChange', 'accessGroupMemberAdd', 'accessGroupProjectAttach', 'sshPublicKeyCreate', 'generateShellToken', 'passkeyDelete', 'twoFactorInfoDelete', 'workspaceTwoFactorEnforcementUpdate', 'projectMemberRemove', 'projectLeave', 'workspaceUserRemove', 'workspaceLeave', 'workspaceInviteCodeUse', 'inviteCodeUse', 'accessGroupUpdate', 'accessGroupDelete', 'accessGroupMemberRemove', 'accessGroupProjectDetach', 'twoFactorInfoCreate', 'twoFactorInfoSecret', 'databasePasswordReset', 'bucketCredentialsReset', 'usageLimitRemove', 'sshSignupApprove', 'usageLimitSet', 'agentUsageLimitSet', 'workspacePolicyDeploySourceAllowlistAdd', 'workspacePolicyDeploySourceAllowlistRemove', 'workspacePolicyItemUpdate'])"
level = "ask-always"
