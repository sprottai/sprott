setup = """
Railway's API is a single GraphQL endpoint. Put the phantom in the bearer header;
the proxy substitutes it at egress, the token never enters the agent:
  sprott run -- curl https://backboard.railway.com/graphql/v2 \\
    -H "Authorization: Bearer __sprott__railway__" \\
    -H "Content-Type: application/json" \\
    -d '{"query":"query { me { name } }"}'
A project token goes in `Project-Access-Token: __sprott__railway__` instead.
Multi-account: switch the phantom value (__sprott__railway_work__).
"""

[service]
id = "railway"
name = "Railway"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["dev"]

# One account/team token backs the whole GraphQL API. Both hosts resolve
# (railway.app is the legacy domain, railway.com the current one).
hosts = ["backboard.railway.com", "backboard.railway.app"]
secrets = ["RAILWAY_API_TOKEN"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://railway.com/account/tokens"

# Every call is a GraphQL request to one endpoint, so the operation lives in the
# body. Policy decides on the called fields; an approval binds every call with
# its arguments (`request`) and the card shows them in words (`calls`). A body
# that isn't a GraphQL request a server would run is refused, as the server
# would refuse it.
[requests.graphql]
method = "POST"
path = "/graphql/*"
vars.request = { in = "graphql", at = "request" }
vars.calls   = { in = "graphql", at = "calls" }
vars.fields  = { in = "graphql", at = "fields" }
scope   = ["request", "calls", "fields"]
consent = "{{ vars.calls | graphql }}"
