# Creem policy. Reads, checkouts, products, discounts, subscriptions,
# customers, refunds and credits go through. Asks in live mode before revenue
# is split with someone, store events go to a new web address, or a webhook
# signing secret is read. Test mode (test-api.creem.io) never asks. `refund`
# is a switch at "allow": set it to "ask-always" to approve every live refund.
# See docs/POLICY.md.

[default]
read = "allow"
write = "allow"

# Creem refunds the whole payment; the request names only the payment.
[[rule]]
id = "refund"
label = "Refund a payment"
label_zh = "退款"
consent = "Refund payment {{ request.body.transaction_id }} in full."
consent_zh = "为交易 {{ request.body.transaction_id }} 全额退款。"
method = "POST"
path = "/v1/refunds"
condition = "request.host != 'test-api.creem.io'"
level = "allow"

[[rule]]
id = "revenue-split"
label = "Send a share of revenue to someone"
label_zh = "把一部分收入分给他人"
consent = "Send a share of this {{ request.body.type }}'s revenue to {{ request.body.recipients }}."
consent_zh = "把这个 {{ request.body.type }} 的一部分收入分给 {{ request.body.recipients }}。"
method = "POST"
path = "/v1/splits"
condition = "request.host != 'test-api.creem.io'"
level = "ask-always"

# Every payment and customer event goes to that address. Test-feed (`cli`)
# endpoints and name or status edits go through.
[[rule]]
id = "webhook-url"
label = "Send store events to a web address"
label_zh = "把商店事件发送到一个网址"
consent = "Send this store's payment and customer events to {{ request.body.url }}."
consent_zh = "把这个商店的付款和客户事件发送到 {{ request.body.url }}。"
method = ["POST", "PATCH"]
path = ["/v1/webhooks", "/v1/webhooks/:webhook"]
condition = "request.host != 'test-api.creem.io' && has(request.body.url) && !(has(request.body.delivery_mode) && request.body.delivery_mode == 'cli')"
level = "ask-always"

# Whoever holds it can forge "payment succeeded" events to the store's server.
[[rule]]
id = "webhook-secret"
label = "Read a webhook signing secret"
label_zh = "读取 webhook 签名密钥"
consent = "Show this webhook's signing secret. Whoever has it can send your server fake payment events."
consent_zh = "读取这个 webhook 的签名密钥，拿到它的人可以向你的服务器伪造付款事件。"
method = "GET"
path = "/v1/webhooks/:webhook/secret"
condition = "request.host != 'test-api.creem.io'"
level = "ask-always"
