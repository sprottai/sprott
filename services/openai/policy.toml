[default]
read = "allow"
write = "allow"

[[rule]]
id = "expensive-model"
label = "Use expensive model"
match = ["POST /v1/chat/completions", "POST /v1/responses", "POST /v1/completions"]
when = "['o3', 'o4-mini', 'gpt-4.5'].exists(p, vars.model.startsWith(p) || vars.model.startsWith('ft:' + p))"
level = "ask"
