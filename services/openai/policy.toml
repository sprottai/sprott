[default]
read = "allow"
write = "allow"

[[rule]]
id = "expensive-model"
label = "Use expensive model"
method = "POST"
path = [
  "/v1/chat/completions", "/v1/responses", "/v1/completions",
  "/v1/threads/runs", "/v1/threads/:thread/runs",
  "/v1/assistants", "/v1/assistants/:assistant",
]
# OpenAI accepts `"model": null` (the assistant's own model): it rides the floor.
condition = "has(request.body.model) && request.body.model != null && ['o3', 'o4-mini', 'gpt-4.5'].exists(p, request.body.model.startsWith(p) || request.body.model.startsWith('ft:' + p))"
level = "ask"

# A batch job names its model per line inside the uploaded file, which this
# request doesn't carry, so the run itself asks.
[[rule]]
id = "batch-run"
label = "Run a batch job (its model is chosen in the uploaded file)"
method = "POST"
path = "/v1/batches"
level = "ask"
