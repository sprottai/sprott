[service]
id = "openai"
name = "OpenAI"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["ai"]
group = "openai"

hosts = ["api.openai.com"]
secrets = ["OPENAI_API_KEY"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://platform.openai.com/api-keys"

# A generation request names its model in the body; policy decides on it and
# an approval binds it.
# Where a request names the model it runs: the generation endpoints, an
# Assistants run (its `model` overrides the assistant's), and creating or
# changing an assistant (runs without an override use the assistant's model).
[requests.generate]
match = [
  "POST /v1/chat/completions", "POST /v1/responses", "POST /v1/completions",
  "POST /v1/threads/runs", "POST /v1/threads/*/runs",
  "POST /v1/assistants", "POST /v1/assistants/*",
]
vars.model = "/model"
scope = ["model"]
